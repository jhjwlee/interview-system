<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="2027 서울 국제대회 자원봉사자관리부(VM) 인터뷰 예약·헬프데스크 시스템 HTML 목업 모음">
<title>인터뷰 예약 · 문의 시스템 화면 모음 | 2027 서울 국제대회 VM</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    /* ---- Augen Pro 참조 토큰 (design-tokens.md, Apple 스타일 벤치마킹) ---- */
    --color-off-black:#0f1012;
    --color-pure-black:#020201;
    --color-off-white:#f2f2f4;
    --color-pure-white:#fdfdfd;
    --color-steel-gray:#5e5e5e;
    --color-ash-gray:#8f8f8f;
    --color-signal-blue:#0071e3;
    --color-signal-blue-wash:rgba(0,113,227,0.07);
    --border-hair:rgba(0,0,0,0.08);

    --font-main:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,system-ui,sans-serif;
    --weight-book:350;
    --weight-label:400;
    --tracking:-0.02em;

    --radius-pill:9999px;
    --radius-nav:14px;
    --radius-cta:26px;

    --side-w:296px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font-main); font-weight:var(--weight-book); letter-spacing:var(--tracking);
    color:var(--color-off-black); background:var(--color-off-white);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  body, .brand, .side, .main .bar{ word-break:keep-all; overflow-wrap:anywhere; }

  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}

  /* ============ 상단바 — 일반 문서 흐름(static)이라 높이가 몇 줄이 되든 항상 안 겹침 ============ */
  .topbar{
    flex:none; position:relative; z-index:40;
    background:rgba(253,253,253,0.9); backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:0.5px solid var(--border-hair);
    padding:12px clamp(14px, 3vw, 26px);
    padding-top:calc(12px + env(safe-area-inset-top, 0px));
    display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px;
  }
  .topbar .left{display:flex; align-items:center; gap:12px; min-width:0; flex:1 1 auto;}
  .topbar .burger{
    display:none; flex:none; width:36px; height:36px; border-radius:var(--radius-nav);
    background:var(--color-signal-blue-wash); color:var(--color-off-black); font-size:15px;
    align-items:center; justify-content:center;
  }
  .brand{min-width:0;}
  .brand .t1{
    display:block; font-size:clamp(16px, 4.4vw, 21px); font-weight:var(--weight-book);
    line-height:1.22; letter-spacing:var(--tracking); color:var(--color-off-black);
  }
  .brand .t2{
    display:block; margin-top:2px; font-size:clamp(10px, 2.6vw, 11.5px); font-weight:var(--weight-book);
    color:var(--color-steel-gray); line-height:1.5;
  }
  .topbar .center{flex:1 1 220px; display:flex; justify-content:center; order:3;}
  .pill-cta{
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(15,16,18,0.05); color:var(--color-pure-black);
    border-radius:var(--radius-cta); padding:10px 18px;
    font-size:clamp(11.5px, 2.8vw, 13px); font-weight:var(--weight-label);
    text-decoration:none; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis;
  }
  .pill-cta:hover{background:rgba(15,16,18,0.09);}
  .pill-cta .ic{color:var(--color-signal-blue); flex:none;}
  .topbar .right{flex:none; order:2; margin-left:auto;}
  @media (min-width:901px){
    .topbar .center{order:2;}
    .topbar .right{order:3; margin-left:0;}
  }

  /* ============ 본문 행 (사이드바 + 메인) — 남은 세로 공간을 flex:1로 채움 ============ */
  .body-row{flex:1 1 auto; min-height:0; display:flex; position:relative;}

  /* ============ 사이드바 ============ */
  .side{
    flex:none; width:var(--side-w); background:var(--color-pure-white);
    border-right:0.5px solid var(--border-hair); overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px 14px 40px;
  }
  .side .grp{
    font-size:11px; font-weight:var(--weight-label); color:var(--color-ash-gray);
    letter-spacing:0.02em; padding:16px 10px 8px;
  }
  .side .grp:first-child{padding-top:2px;}
  .side a.nav{
    display:flex; gap:11px; align-items:flex-start; text-decoration:none; color:var(--color-off-black);
    padding:11px 12px; margin-bottom:3px; border-radius:var(--radius-nav);
    border:0.5px solid transparent; transition:background .12s, border-color .12s;
  }
  .side a.nav:hover{background:var(--color-off-white);}
  .side a.nav.active{background:var(--color-signal-blue-wash); border-color:rgba(0,113,227,0.22);}
  .side a.nav .dot{flex:none; width:7px; height:7px; margin-top:6px; border-radius:50%; background:var(--border-hair);}
  .side a.nav.active .dot{background:var(--color-signal-blue);}
  .side a.nav .tx{min-width:0;}
  .side a.nav .t{display:block; font-size:14px; font-weight:var(--weight-book); line-height:1.4; color:var(--color-off-black);}
  .side a.nav.active .t{color:var(--color-signal-blue);}
  .side a.nav .s{display:block; font-size:12px; color:var(--color-ash-gray); line-height:1.5; margin-top:2px;}
  .side .sep{height:0.5px; background:var(--border-hair); margin:14px 10px;}
  .side .note{font-size:11.5px; color:var(--color-ash-gray); line-height:1.7; padding:8px 10px 0;}

  /* ============ 메인 (상태바 + iframe, flex column으로 iframe이 남는 높이 전부 사용) ============ */
  .main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; background:var(--color-off-white);}
  .main .bar{
    flex:none; min-height:44px; background:var(--color-pure-white); border-bottom:0.5px solid var(--border-hair);
    display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; padding:9px 16px;
    font-size:12.5px; color:var(--color-steel-gray);
  }
  .main .bar .cur{font-weight:var(--weight-book); color:var(--color-off-black); min-width:0;}
  .main .bar .role{
    font-size:10px; font-weight:var(--weight-label); border-radius:var(--radius-pill);
    padding:3px 10px; flex-shrink:0; border:0.5px solid var(--color-signal-blue); color:var(--color-signal-blue);
  }
  .main .bar .sp{flex:1 1 auto;}
  .main .bar a{color:var(--color-signal-blue); font-size:12px; font-weight:var(--weight-label); text-decoration:none; white-space:nowrap;}
  .main .bar a:hover{text-decoration:underline;}
  .main iframe{flex:1 1 auto; min-height:0; width:100%; border:none; display:block; background:#fff;}

  .scrim{display:none; position:fixed; inset:0; background:rgba(15,16,18,0.35); z-index:32;}

  /* ============ 모바일 / 폴더블 대응 ============ */
  @media (max-width:900px){
    .topbar .burger{display:flex;}
    .side{
      position:fixed; top:0; bottom:0; left:0; z-index:35; height:100dvh;
      transform:translateX(-100%); transition:transform 0.22s ease;
      box-shadow:8px 0 30px rgba(15,16,18,0.16); width:min(var(--side-w), 84vw);
    }
    .side.open{transform:translateX(0);}
    .scrim.show{display:block;}
  }
  /* 초소형 화면 (갤럭시 Z 플립 커버 화면 등) */
  @media (max-width:360px){
    .topbar{padding-left:12px; padding-right:12px;}
    .pill-cta{padding:8px 14px;}
    .main .bar{padding-left:12px; padding-right:12px;}
  }
  /* 태블릿/폴더블 펼침 화면 — 사이드바 폭을 살짝 축소해 본문 공간 확보 */
  @media (min-width:901px) and (max-width:1080px){
    :root{--side-w:250px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="left">
    <button class="burger" id="burger" aria-label="메뉴 열기">☰</button>
    <div class="brand">
      <span class="t1">인터뷰 예약 · 문의 시스템</span>
    </div>
  </div>
  <div class="right"><button id="resetDemoBtn" style="display:inline-flex; align-items:center; gap:6px; background:rgba(15,16,18,0.05); color:var(--color-off-black); border-radius:9999px; padding:8px 14px; font-size:12px; font-weight:400; cursor:pointer;">데모 초기화</button></div>
</div>

<div class="body-row">
  <nav class="side" id="side"></nav>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="bar">
      <span class="role" id="curRole">개요</span>
      <span class="cur" id="curTitle">전체 워크플로우</span>
      <span class="sp"></span>
      <a href="#" id="openNew" target="_blank" rel="noopener">새 창에서 열기 ↗</a>
    </div>
    <iframe id="frame" title="화면 목업" src="screens/00-workflow.html"></iframe>
  </main>
</div>

<script>
var SCREENS = [
  {grp:'개요', id:'00-workflow', title:'전체 워크플로우', sub:'9개 화면을 하나의 흐름으로', role:'개요'},
  {grp:'신청자 · 문의자', id:'01-applicant-form', title:'예약하기 · 문의하기', sub:'신청자가 직접 쓰는 화면', role:'신청자'},
  {grp:'인터뷰어', id:'03-interviewer-availability', title:'가능한 시간 알려주기', sub:'인터뷰가 가능한 날짜·시간 등록', role:'인터뷰어'},
  {grp:'인터뷰어', id:'04-interviewer-approval', title:'배정 시간 확인', sub:'신청자에게 열기 전 진행 여부 확인', role:'인터뷰어'},
  {grp:'인터뷰어', id:'06-teams-approval', title:'Teams 확인 요청', sub:'Teams 채팅으로 받는 확인 카드', role:'인터뷰어'},
  {grp:'VM 관리자', id:'02-admin-booking', title:'예약시스템', sub:'슬롯 개설 · 예약 현황 · 인터뷰어 배정', role:'관리자'},
  {grp:'VM 관리자', id:'09-weekly-dashboard', title:'주간 수급 현황', sub:'시간대별 확보 슬롯 vs 지원자 신청', role:'관리자'},
  {grp:'VM 관리자', id:'05-admin-helpdesk', title:'헬프데스크', sub:'문의 티켓 확인 · 배정 · 처리', role:'관리자'},
  {grp:'VM 관리자', id:'07-teams-reassign', title:'Teams 재배정 알림', sub:'배정 어려움 · 무응답 시 관리자 알림', role:'관리자'},
  {grp:'Teams 통합', id:'08-teams-tab', title:'Teams 탭 내장 화면', sub:'Teams 안에서 시스템을 쓰는 모습', role:'통합'}
];

var side = document.getElementById('side');
var frame = document.getElementById('frame');
var curTitle = document.getElementById('curTitle');
var curRole = document.getElementById('curRole');
var openNew = document.getElementById('openNew');
var burger = document.getElementById('burger');
var scrim = document.getElementById('scrim');

// ---------- 사이드바 렌더 ----------
var html = '';
var lastGrp = null;
SCREENS.forEach(function(s){
  if(s.grp !== lastGrp){ html += '<div class="grp">' + s.grp + '</div>'; lastGrp = s.grp; }
  html += '<a class="nav" href="#' + s.id + '" data-id="' + s.id + '">' +
            '<span class="dot"></span>' +
            '<span class="tx"><span class="t">' + s.title + '</span>' +
            '<span class="s">' + s.sub + '</span></span></a>';
});
html += '<div class="sep"></div>' +
        '<div class="note">🔗 표시가 있는 4개 화면(예약하기·가능한 시간 알려주기·배정 시간 확인·예약시스템)은 ' +
        '브라우저에 저장되는 연동 데모입니다. 인터뷰어가 시간을 알려주면 관리자·신청자 화면에 실제로 반영됩니다. ' +
        '나머지 화면은 정적 목업입니다. 상단 "데모 초기화"로 언제든 처음 상태로 되돌릴 수 있습니다.</div>';
side.innerHTML = html;

// ---------- 라우팅 ----------
function go(id, replace){
  var s = null;
  for(var i=0;i<SCREENS.length;i++){ if(SCREENS[i].id === id){ s = SCREENS[i]; break; } }
  if(!s) s = SCREENS[0];
  var url = 'screens/' + s.id + '.html';
  if(frame.getAttribute('src') !== url) frame.setAttribute('src', url);
  curTitle.textContent = s.title;
  curRole.textContent = s.role;
  openNew.href = url;
  document.title = s.title + ' | 인터뷰 예약 · 문의 시스템 화면 모음';
  document.querySelectorAll('.side a.nav').forEach(function(a){
    a.classList.toggle('active', a.dataset.id === s.id);
  });
  if(location.hash.slice(1) !== s.id){
    if(replace) history.replaceState(null, '', '#' + s.id);
    else location.hash = s.id;
  }
  closeSide();
}

function fromHash(){ go(location.hash.slice(1) || SCREENS[0].id, true); }
window.addEventListener('hashchange', fromHash);
fromHash();

// 워크플로우 페이지 안의 버튼에서 오는 이동 요청
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'go' && e.data.screen) go(e.data.screen);
});

// ---------- 모바일 드로어 ----------
function openSide(){ side.classList.add('open'); scrim.classList.add('show'); }
function closeSide(){ side.classList.remove('open'); scrim.classList.remove('show'); }
burger.addEventListener('click', openSide);
scrim.addEventListener('click', closeSide);

// ---------- 데모 초기화 (연동 데모 4화면이 쓰는 localStorage 리셋) ----------
document.getElementById('resetDemoBtn').addEventListener('click', function(){
  if(!confirm('데모 데이터를 처음 상태로 되돌릴까요? 지금까지 등록·예약한 내용이 모두 사라집니다.')) return;
  try{ localStorage.removeItem('vm2027_interview_demo_v1'); }catch(e){}
  frame.contentWindow.location.reload();
});

// ---------- 키보드 이동 (← →) ----------
document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  var idx = -1, cur = location.hash.slice(1) || SCREENS[0].id;
  for(var i=0;i<SCREENS.length;i++){ if(SCREENS[i].id === cur){ idx = i; break; } }
  if(idx < 0) return;
  if(e.key === 'ArrowRight' && idx < SCREENS.length-1) go(SCREENS[idx+1].id);
  if(e.key === 'ArrowLeft' && idx > 0) go(SCREENS[idx-1].id);
});
</script>
</body>
</html>
