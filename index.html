<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="2027 서울 국제대회 자원봉사자관리부(VM) 인터뷰 예약·헬프데스크 시스템 HTML 목업 모음">
<title>인터뷰 예약 · 헬프데스크 시스템 목업 | 2027 서울 국제대회 VM</title>
<style>
  :root{
    --deep-green:#003C33; --deep-green-2:#00594C; --ink:#212121; --gray:#555; --gray-light:#9A9A9A;
    --teal:#1C6E8C; --purple:#5B5FC7; --coral:#B5432B; --gold:#8A6D00;
    --light-gray:#F7F7F8; --border:#E3E3E3; --pale-green:#E8F5EE;
    --side:284px; --topbar:54px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink);
    background:var(--light-gray); overflow:hidden; -webkit-font-smoothing:antialiased;}

  /* ---------- 상단바 ---------- */
  .topbar{
    height:var(--topbar); background:var(--deep-green); color:#fff; display:flex; align-items:center;
    gap:12px; padding:0 16px; position:fixed; top:0; left:0; right:0; z-index:40;
  }
  .topbar .burger{
    display:none; width:34px; height:34px; border-radius:8px; border:none; background:rgba(255,255,255,0.14);
    color:#fff; font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .topbar .brand{font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .brand small{display:block; font-size:10.5px; font-weight:600; color:#9FC9BF; margin-top:1px;}
  .topbar .spacer{flex:1;}
  .topbar a.ext{
    color:#fff; text-decoration:none; font-size:11.5px; font-weight:700; background:rgba(255,255,255,0.14);
    border-radius:7px; padding:7px 12px; white-space:nowrap;
  }
  .topbar a.ext:hover{background:rgba(255,255,255,0.24);}

  /* ---------- 사이드바 ---------- */
  .side{
    position:fixed; top:var(--topbar); bottom:0; left:0; width:var(--side); background:#fff;
    border-right:1px solid var(--border); overflow-y:auto; padding:14px 0 30px; z-index:30;
  }
  .side .grp{
    font-size:10.5px; font-weight:800; color:var(--gray-light); letter-spacing:0.4px;
    padding:14px 18px 6px;
  }
  .side a.nav{
    display:flex; gap:10px; align-items:flex-start; text-decoration:none; color:var(--ink);
    padding:9px 14px; margin:1px 8px; border-radius:9px; transition:0.12s;
  }
  .side a.nav:hover{background:var(--light-gray);}
  .side a.nav.active{background:var(--pale-green);}
  .side a.nav .ic{
    width:26px; height:26px; border-radius:7px; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-size:13px; background:var(--light-gray);
  }
  .side a.nav.active .ic{background:var(--deep-green); color:#fff;}
  .side a.nav .tx{min-width:0;}
  .side a.nav .tx .t, .side a.nav .tx .s{display:block;}
  .side a.nav .t{font-size:12.5px; font-weight:700; line-height:1.4;}
  .side a.nav.active .t{color:var(--deep-green);}
  .side a.nav .s{font-size:10.5px; color:var(--gray-light); line-height:1.45; margin-top:2px;}
  .side .sep{height:1px; background:var(--border); margin:12px 16px;}
  .side .note{font-size:10.5px; color:var(--gray-light); line-height:1.6; padding:4px 18px 0;}

  /* ---------- 본문 ---------- */
  .main{
    position:fixed; top:var(--topbar); left:var(--side); right:0; bottom:0; background:var(--light-gray);
  }
  .main .bar{
    height:40px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center;
    gap:10px; padding:0 14px; font-size:12px; color:var(--gray);
  }
  .main .bar .cur{font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .main .bar .role{
    font-size:10px; font-weight:800; border-radius:5px; padding:2px 7px; flex-shrink:0;
  }
  .r-app{background:var(--pale-green); color:var(--deep-green);}
  .r-iv{background:#E4F0F4; color:var(--teal);}
  .r-adm{background:#EEE; color:#4A4A4A;}
  .r-sys{background:#EDEDF9; color:var(--purple);}
  .main .bar .sp{flex:1;}
  .main .bar a{
    color:var(--teal); font-size:11.5px; font-weight:700; text-decoration:none; white-space:nowrap;
  }
  .main .bar a:hover{text-decoration:underline;}
  .main iframe{width:100%; height:calc(100% - 40px); border:none; display:block; background:#fff;}

  .scrim{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:25;
  }

  /* ---------- 모바일 ---------- */
  @media (max-width:900px){
    .topbar .burger{display:block;}
    .side{transform:translateX(-100%); transition:transform 0.22s ease; box-shadow:4px 0 20px rgba(0,0,0,0.14);}
    .side.open{transform:translateX(0);}
    .main{left:0;}
    .scrim.show{display:block;}
    .topbar a.ext{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="burger" id="burger" aria-label="메뉴">☰</button>
  <div class="brand">인터뷰 예약 · 헬프데스크 시스템 목업<small>2027 서울 국제대회 · 자원봉사자관리부(VM)</small></div>
  <div class="spacer"></div>
  <a class="ext" href="docs/design-background-manual.pdf" target="_blank" rel="noopener">📄 설계배경·사용메뉴얼 PDF</a>
</div>

<nav class="side" id="side"></nav>
<div class="scrim" id="scrim"></div>

<main class="main">
  <div class="bar">
    <span class="role" id="curRole">개요</span>
    <span class="cur" id="curTitle">전체 워크플로우</span>
    <span class="sp"></span>
    <a href="#" id="openNew" target="_blank" rel="noopener">새 창에서 열기 ↗</a>
  </div>
  <iframe id="frame" title="화면 목업" src="screens/00-workflow.html"></iframe>
</main>

<script>
var SCREENS = [
  {grp:'개요', id:'00-workflow', icon:'🧭', title:'전체 워크플로우', sub:'9개 화면을 하나의 흐름으로', role:'개요', rc:'r-sys'},
  {grp:'신청자 · 문의자', id:'01-applicant-form', icon:'📝', title:'입력폼', sub:'인터뷰 예약 신청 · 헬프데스크 문의', role:'신청자', rc:'r-app'},
  {grp:'인터뷰어', id:'03-interviewer-availability', icon:'🕐', title:'가용시간 등록', sub:'가능한 날짜·시간 사전 등록', role:'인터뷰어', rc:'r-iv'},
  {grp:'인터뷰어', id:'04-interviewer-approval', icon:'✅', title:'슬롯 배정 확인', sub:'접수 개방 전 배정 시간대 확인', role:'인터뷰어', rc:'r-iv'},
  {grp:'인터뷰어', id:'06-teams-approval', icon:'💬', title:'Teams 배정 확인 카드', sub:'Power Automate 승인 커넥터 알림', role:'인터뷰어', rc:'r-iv'},
  {grp:'VM 관리자', id:'02-admin-booking', icon:'📅', title:'예약시스템', sub:'슬롯 개설 · 예약 현황 · 인터뷰어 배정', role:'관리자', rc:'r-adm'},
  {grp:'VM 관리자', id:'09-weekly-dashboard', icon:'📊', title:'주간 수급 현황', sub:'시간대별 확보 슬롯 vs 지원자 신청', role:'관리자', rc:'r-adm'},
  {grp:'VM 관리자', id:'05-admin-helpdesk', icon:'🎧', title:'헬프데스크', sub:'문의 티켓 확인 · 배정 · 처리', role:'관리자', rc:'r-adm'},
  {grp:'VM 관리자', id:'07-teams-reassign', icon:'🔁', title:'Teams 재배정 알림', sub:'배정 어려움 · 무응답 시 관리자 알림', role:'관리자', rc:'r-adm'},
  {grp:'Teams 통합', id:'08-teams-tab', icon:'👥', title:'Teams 탭 내장 화면', sub:'Teams 안에서 시스템을 쓰는 모습', role:'통합', rc:'r-sys'}
];

var side = document.getElementById('side');
var frame = document.getElementById('frame');
var curTitle = document.getElementById('curTitle');
var curRole = document.getElementById('curRole');
var openNew = document.getElementById('openNew');
var burger = document.getElementById('burger');
var scrim = document.getElementById('scrim');

// ---------- 사이드바 렌더 ----------
var html = '';
var lastGrp = null;
SCREENS.forEach(function(s){
  if(s.grp !== lastGrp){ html += '<div class="grp">' + s.grp + '</div>'; lastGrp = s.grp; }
  html += '<a class="nav" href="#' + s.id + '" data-id="' + s.id + '">' +
            '<span class="ic">' + s.icon + '</span>' +
            '<span class="tx"><span class="t">' + s.title + '</span>' +
            '<span class="s">' + s.sub + '</span></span></a>';
});
html += '<div class="sep"></div>' +
        '<a class="nav" href="docs/design-background-manual.pdf" target="_blank" rel="noopener">' +
        '<span class="ic">📄</span><span class="tx"><span class="t">설계배경 · 사용메뉴얼</span>' +
        '<span class="s">PDF · 2026.07.25</span></span></a>' +
        '<div class="note">모든 화면은 목업입니다. 클릭 동작은 보이지만 실제 데이터는 저장되지 않고, ' +
        '새로고침하면 초기 상태로 돌아갑니다.</div>';
side.innerHTML = html;

// ---------- 라우팅 ----------
function go(id, replace){
  var s = null;
  for(var i=0;i<SCREENS.length;i++){ if(SCREENS[i].id === id){ s = SCREENS[i]; break; } }
  if(!s) s = SCREENS[0];
  var url = 'screens/' + s.id + '.html';
  if(frame.getAttribute('src') !== url) frame.setAttribute('src', url);
  curTitle.textContent = s.title;
  curRole.textContent = s.role;
  curRole.className = 'role ' + s.rc;
  openNew.href = url;
  document.title = s.title + ' | 인터뷰 예약 · 헬프데스크 시스템 목업';
  document.querySelectorAll('.side a.nav').forEach(function(a){
    a.classList.toggle('active', a.dataset.id === s.id);
  });
  if(location.hash.slice(1) !== s.id){
    if(replace) history.replaceState(null, '', '#' + s.id);
    else location.hash = s.id;
  }
  closeSide();
}

function fromHash(){ go(location.hash.slice(1) || SCREENS[0].id, true); }
window.addEventListener('hashchange', fromHash);
fromHash();

// 워크플로우 페이지 안의 버튼에서 오는 이동 요청
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'go' && e.data.screen) go(e.data.screen);
});

// ---------- 모바일 드로어 ----------
function openSide(){ document.getElementById('side').classList.add('open'); scrim.classList.add('show'); }
function closeSide(){ document.getElementById('side').classList.remove('open'); scrim.classList.remove('show'); }
burger.addEventListener('click', openSide);
scrim.addEventListener('click', closeSide);

// ---------- 키보드 이동 (← →) ----------
document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  var idx = -1, cur = location.hash.slice(1) || SCREENS[0].id;
  for(var i=0;i<SCREENS.length;i++){ if(SCREENS[i].id === cur){ idx = i; break; } }
  if(idx < 0) return;
  if(e.key === 'ArrowRight' && idx < SCREENS.length-1) go(SCREENS[idx+1].id);
  if(e.key === 'ArrowLeft' && idx > 0) go(SCREENS[idx-1].id);
});
</script>
</body>
</html>
