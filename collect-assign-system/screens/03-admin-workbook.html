<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>배정 관리 워크북 (수집·배정형 샘플)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="../../assets/augen.css">
<style>
  :root{
    --deep-green:var(--ink); --gray:var(--steel); --gray-light:var(--ash);
    --light-gray:var(--canvas); --border:var(--hair); --pale-teal:var(--blue-wash); --teal:var(--blue);
    --ok:#1c8c5e; --warn:#b25c00; --pale-ok:#e8f5ee; --pale-warn:#fbf3da;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font,'Pretendard Variable','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif); font-weight:350; letter-spacing:-0.02em; background:var(--canvas); color:var(--ink); line-height:1.6; min-height:100vh; word-break:keep-all;}
  .wrap{max-width:1080px; margin:0 auto; padding:26px 18px 70px;}
  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .toolbar-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .runbtn{background:var(--blue); color:#fff; border:none; border-radius:9999px; padding:13px 24px; font-size:14px; font-weight:400; cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:0 2px 10px rgba(0,113,227,0.28);}
  .runbtn:hover{background:#0064cc;}
  .resetbtn{background:transparent; color:var(--gray); border:1.5px solid var(--border); border-radius:9999px; padding:11px 18px; font-size:12.5px; font-weight:350; cursor:pointer;}
  .resetbtn:hover{border-color:var(--gray);}
  .lastrun{font-size:11.5px; color:var(--gray-light);}
  .runresult{display:none; background:var(--pale-teal); color:var(--teal); border-radius:13px; padding:10px 16px; font-size:12.5px; margin-bottom:16px; align-items:center; gap:8px;}
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-btn{background:var(--surface); border:1.5px solid var(--border); border-radius:9999px; padding:10px 16px; font-size:12.5px; font-weight:400; color:var(--gray); cursor:pointer; transition:0.12s;}
  .tab-btn:hover{border-color:var(--gray-light);}
  .tab-btn.active{color:#fff; background:var(--ink); border-color:var(--ink); font-weight:400;}
  .tab-btn .cnt{font-size:10.5px; background:rgba(255,255,255,0.16); color:inherit; border-radius:9999px; padding:1px 7px; margin-left:6px;}
  .tab-btn:not(.active) .cnt{background:var(--light-gray); color:var(--gray);}
  .sheet{display:none; background:var(--surface); border-radius:18px; border:0.5px solid var(--hair); padding:6px; overflow-x:auto;}
  .sheet.active{display:block;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:600px;}
  th{text-align:left; font-weight:400; color:var(--gray); font-size:11px; padding:10px 12px; border-bottom:1.5px solid var(--border); white-space:nowrap; background:var(--light-gray);}
  th:first-child{border-radius:12px 0 0 0;} th:last-child{border-radius:0 12px 0 0;}
  td{padding:9px 12px; border-bottom:1px solid var(--border); color:var(--ink); white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block; font-size:11px; font-weight:400; padding:3px 10px; border-radius:9999px;}
  .p-ok{background:var(--pale-ok); color:var(--ok);}
  .p-warn{background:var(--pale-warn); color:var(--warn);}
  .p-idle{background:var(--light-gray); color:var(--gray-light);}
  .p-full{background:#fbeae6; color:#b5432b;}
  .empty-row td{color:var(--gray-light); text-align:center; padding:26px;}
  .log-panel{margin-top:18px; background:var(--surface); border-radius:18px; border:0.5px solid var(--hair); padding:16px 18px;}
  .log-panel h3{font-size:12.5px; font-weight:400; margin-bottom:10px; color:var(--gray);}
  .log-item{font-size:12px; color:var(--gray); padding:6px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:10px;}
  .log-item:last-child{border-bottom:none;}
  .log-item .t{color:var(--gray-light); flex-shrink:0; font-size:11px;}
  .footer-tag{text-align:center; margin-top:16px; font-size:10.5px; color:var(--ash);}
  .footer-tag a{color:var(--blue);}

  .bubble{position:relative; background:#fff7d6; border:1.5px solid #e8cf6b; border-radius:16px; padding:12px 16px; font-size:12px; color:#5c4c00; line-height:1.6; margin:0 0 16px; display:flex; gap:9px; align-items:flex-start;}
  .bubble .ic{font-size:15px; flex-shrink:0; line-height:1.3;}
  .bubble b{color:#3d3200;}
  .bubble ol{margin:6px 0 0 16px; padding:0;}
  .bubble li{margin-bottom:3px;}
  .bubble.small{font-size:11.5px; margin:0 0 12px;}
</style>
</head>
<body>
<script src="../assets/nav.js"></script>
<script src="../assets/auth.js"></script>

<div class="topbar">
  <div class="brand">
    <div>
      <h1>배정 관리 워크북</h1>
      <div class="sub">실제 Excel 워크북의 5개 시트를 그대로 흉내 낸 화면입니다 · "배정 실행"이 Office Script와 같은 로직을 돌립니다</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
    <div class="tag">샘플 · SAMPLE</div>
    <div class="tag" style="border-color:var(--blue); color:var(--blue);">연동 데모</div>
  </div>
</div>

<div class="wrap">
  
  
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="runbtn" onclick="runAssignment()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        배정 실행
      </button>
      <span class="lastrun" id="lastRunLabel">아직 실행 전</span>
    </div>
    <button class="resetbtn" onclick="resetDemo()">데모 초기화</button>
  </div>

  
  <div class="runresult" id="runResult"></div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="slots" onclick="switchTab('slots')">①슬롯마스터<span class="cnt" id="cntSlots">0</span></button>
    <button class="tab-btn" data-tab="avail" onclick="switchTab('avail')">②인터뷰어가용시간<span class="cnt" id="cntAvail">0</span></button>
    <button class="tab-btn" data-tab="applicant" onclick="switchTab('applicant')">③지원자접수<span class="cnt" id="cntApplicant">0</span></button>
    <button class="tab-btn" data-tab="result" onclick="switchTab('result')">④배정결과<span class="cnt" id="cntResult">0</span></button>
    <button class="tab-btn" data-tab="helpdesk" onclick="switchTab('helpdesk')">⑤헬프데스크<span class="cnt" id="cntHelpdesk">0</span></button>
  </div>

  <div class="sheet active" id="sheet-slots">
    <table>
      <thead><tr><th>슬롯ID</th><th>날짜</th><th>시간</th><th>정원</th><th>현재예약</th><th>배정인터뷰어</th><th>상태</th></tr></thead>
      <tbody id="tbodySlots"></tbody>
    </table>
  </div>
  <div class="sheet" id="sheet-avail">
    <table>
      <thead><tr><th>이름</th><th>이메일</th><th>1일최대건수</th><th>가능날짜</th><th>가능시간</th><th>제출시각</th></tr></thead>
      <tbody id="tbodyAvail"></tbody>
    </table>
  </div>
  <div class="sheet" id="sheet-applicant">
    <table>
      <thead><tr><th>이름</th><th>이메일</th><th>구분</th><th>가능시간</th><th>배정슬롯ID</th><th>상태</th></tr></thead>
      <tbody id="tbodyApplicant"></tbody>
    </table>
  </div>
  <div class="sheet" id="sheet-result">
    <table>
      <thead><tr><th>접수ID</th><th>지원자명</th><th>이메일</th><th>배정슬롯ID</th><th>배정날짜</th><th>배정시간</th><th>배정인터뷰어</th></tr></thead>
      <tbody id="tbodyResult"></tbody>
    </table>
  </div>

  <div class="sheet" id="sheet-helpdesk">
    <table>
      <thead><tr><th>문의유형</th><th>이름</th><th>이메일</th><th>문의내용</th><th>접수시각</th></tr></thead>
      <tbody id="tbodyHelpdesk"></tbody>
    </table>
  </div>

  <div class="log-panel">
    <h3>최근 활동 로그</h3>
    <div id="logList"></div>
  </div>

  <div class="footer-tag">이 화면은 브라우저에 저장되는 연동 데모입니다 · <a href="01-applicant-submit.html">지원자 화면</a> · <a href="02-interviewer-submit.html">인터뷰어 화면</a> · <a href="04-helpdesk.html">문의하기 화면</a></div>
</div>

<script src="../assets/store.js"></script>
<script>
  // 접근 권한 가드 (독립 실행/직접 링크 접속 시 대비) — 앱 셸(app.html) 안에서는
  // 이미 로그인 여부를 확인한 뒤에만 이 화면을 불러오므로 정상적으로는 걸리지 않습니다.
  (function () {
    try {
      if (window.top === window.self) {
        var s = window.CAAuth && CAAuth.getSession();
        var ok = s && (s.role === 'admin');
        if (!ok) { location.href = '00-login.html'; }
      }
    } catch (e) {}
  })();
</script>
<script>
  function switchTab(name){
    document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===name));
    document.querySelectorAll('.sheet').forEach(s=> s.classList.toggle('active', s.id==='sheet-'+name));
  }

  function statusPill(status){
    var cls = 'p-idle';
    if(status==='모집중') cls='p-ok';
    else if(status==='마감임박') cls='p-warn';
    else if(status==='마감') cls='p-full';
    else if(status==='배정완료') cls='p-ok';
    else if(status==='수동조율필요') cls='p-warn';
    else if(status==='배정검토중' || status==='배정대기') cls='p-idle';
    return '<span class="pill '+cls+'">'+(status||'-')+'</span>';
  }

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function render(){
    var state = CAStore.load();

    document.getElementById('cntSlots').textContent = state.slots.length;
    document.getElementById('cntAvail').textContent = state.availability.length;
    document.getElementById('cntApplicant').textContent = state.applicants.length;
    var doneCount = state.applicants.filter(function(r){return r.slotId;}).length;
    document.getElementById('cntResult').textContent = doneCount;
    document.getElementById('cntHelpdesk').textContent = (state.helpdesk||[]).length;

    document.getElementById('lastRunLabel').textContent = state.lastRun ? ('마지막 실행: '+state.lastRun) : '아직 실행 전';

    // 슬롯마스터
    var tS = document.getElementById('tbodySlots');
    tS.innerHTML = state.slots.map(function(s){
      return '<tr><td>'+esc(s.id)+'</td><td>'+CAStore.fmtDateShort(s.date)+'</td><td>'+esc(s.time)+'</td>'+
        '<td>'+s.cap+'</td><td>'+s.booked+'</td><td>'+(s.interviewer?esc(s.interviewer):'<span style="color:var(--gray-light)">미배정</span>')+'</td>'+
        '<td>'+statusPill(s.status)+'</td></tr>';
    }).join('');

    // 인터뷰어가용시간
    var tA = document.getElementById('tbodyAvail');
    if(state.availability.length===0){
      tA.innerHTML = '<tr class="empty-row"><td colspan="6">아직 제출된 인터뷰어 가용시간이 없습니다.</td></tr>';
    } else {
      tA.innerHTML = state.availability.map(function(a){
        return '<tr><td>'+esc(a.name)+'</td><td>'+esc(a.email)+'</td><td>'+esc(a.maxDay)+'</td>'+
          '<td>'+a.dates.map(CAStore.fmtDateShort).join(', ')+'</td><td>'+esc(a.times.join(', '))+'</td><td>'+esc(a.at)+'</td></tr>';
      }).join('');
    }

    // 지원자접수
    var tP = document.getElementById('tbodyApplicant');
    if(state.applicants.length===0){
      tP.innerHTML = '<tr class="empty-row"><td colspan="6">아직 제출된 지원자가 없습니다.</td></tr>';
    } else {
      tP.innerHTML = state.applicants.map(function(r){
        return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.kind)+'</td>'+
          '<td>'+esc((r.times||[]).length)+'건</td><td>'+(r.slotId?esc(r.slotId):'-')+'</td><td>'+statusPill(r.status)+'</td></tr>';
      }).join('');
    }

    // 배정결과
    var tR = document.getElementById('tbodyResult');
    var results = state.applicants.filter(function(r){return r.slotId;});
    if(results.length===0){
      tR.innerHTML = '<tr class="empty-row"><td colspan="7">아직 배정 결과가 없습니다. "배정 실행"을 눌러 보세요.</td></tr>';
    } else {
      tR.innerHTML = results.map(function(r,i){
        var slot = state.slots.find(function(s){return s.id===r.slotId;});
        return '<tr><td>A-'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.slotId)+'</td>'+
          '<td>'+(slot?CAStore.fmtDateShort(slot.date):'-')+'</td><td>'+(slot?esc(slot.time):'-')+'</td><td>'+(slot?esc(slot.interviewer):'-')+'</td></tr>';
      }).join('');
    }

    // 헬프데스크
    var tH = document.getElementById('tbodyHelpdesk');
    var helpdesk = state.helpdesk || [];
    if(helpdesk.length===0){
      tH.innerHTML = '<tr class="empty-row"><td colspan="5">아직 접수된 문의가 없습니다.</td></tr>';
    } else {
      tH.innerHTML = helpdesk.map(function(h){
        return '<tr><td>'+esc(h.type)+'</td><td>'+esc(h.name)+'</td><td>'+esc(h.email)+'</td><td>'+esc(h.body)+'</td><td>'+esc(h.at)+'</td></tr>';
      }).join('');
    }

    // 로그
    var log = document.getElementById('logList');
    if(state.log.length===0){
      log.innerHTML = '<div style="font-size:12px; color:var(--gray-light);">아직 활동이 없습니다.</div>';
    } else {
      log.innerHTML = state.log.map(function(l){
        return '<div class="log-item"><span>'+esc(l.msg)+'</span><span class="t">'+esc(l.at)+'</span></div>';
      }).join('');
    }
  }

  function runAssignment(){
    var state = CAStore.load();
    var result = CAStore.runAssignment(state);
    CAStore.save(state);
    var box = document.getElementById('runResult');
    box.style.display = 'flex';
    box.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 배정 실행 완료 — 배정완료 '+result.successCount+'건 · 수동조율필요 '+result.manualCount+'건';
    render();
  }

  function resetDemo(){
    if(!confirm('데모 데이터를 초기 상태로 되돌릴까요? 브라우저에 저장된 이 데모의 모든 입력이 사라집니다.')) return;
    CAStore.reset();
    document.getElementById('runResult').style.display = 'none';
    render();
  }

  render();
</script>
</body>
</html>
