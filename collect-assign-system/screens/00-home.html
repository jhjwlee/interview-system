<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>인터뷰 배정 앱 홈 (수집·배정형 샘플)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="../../assets/augen.css">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  svg{display:block;}
  body{font-family:var(--font,'Pretendard Variable','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif); font-weight:350; letter-spacing:-0.02em; background:var(--canvas); color:var(--ink); line-height:1.6; min-height:100vh; word-break:keep-all;}
  .wrap{max-width:640px; margin:0 auto; padding:34px 18px 60px;}
  .intro{margin-bottom:22px;}
  .intro h1{font-size:19px; font-weight:500; letter-spacing:-0.02em; margin-bottom:6px;}
  .intro p{font-size:12.5px; color:var(--steel); line-height:1.65;}

  .role-grid{display:flex; flex-direction:column; gap:12px;}
  .role-btn{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
    background:var(--surface); border:0.5px solid var(--hair); border-radius:20px;
    padding:18px 18px; transition:transform .12s, box-shadow .12s;
  }
  .role-btn:active{transform:scale(0.98);}
  .role-btn .ic{
    width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .role-btn .tx{min-width:0; flex:1;}
  .role-btn .tx .t{font-size:14.5px; font-weight:500; margin-bottom:2px;}
  .role-btn .tx .s{font-size:11.5px; color:var(--ash); line-height:1.5;}
  .role-btn .arrow{flex:none; color:var(--ash);}

  .role-btn.applicant .ic{background:var(--blue-wash); color:var(--blue);}
  .role-btn.interviewer .ic{background:#e8f5ee; color:#1c8c5e;}
  .role-btn.admin .ic{background:#fbf3da; color:#b25c00;}
  .role-btn.faq .ic{background:#e6f4f1; color:#0f8b6c;}

  .footer-note{margin-top:26px; text-align:center; font-size:10.5px; color:var(--ash);}
</style>
</head>
<body>
<script src="../assets/nav.js"></script>

<div class="topbar">
  <div class="brand">
    <div>
      <h1>인터뷰 배정 시스템</h1>
      <div class="sub">2027 서울 국제대회 · 자원봉사자관리부(VM) · 수집·배정형 데모</div>
    </div>
  </div>
  <div class="tag">샘플 · SAMPLE</div>
</div>

<div class="wrap">
  <div class="intro">
    <h1>누구신가요?</h1>
    <p>아래에서 해당하는 역할을 선택해 주세요.</p>
  </div>

  <div class="role-grid">
    <a class="role-btn applicant" href="01-applicant-submit.html" onclick="return goRole('applicant', this)">
      <div class="ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      </div>
      <div class="tx">
        <div class="t">인터뷰이(지원자)</div>
        <div class="s">가능한 날짜·시간을 알려주고 인터뷰를 신청합니다</div>
      </div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <a class="role-btn interviewer" href="02-interviewer-submit.html" onclick="return goRole('interviewer', this)">
      <div class="ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <div class="tx">
        <div class="t">인터뷰어</div>
        <div class="s">인터뷰 가능한 날짜와 하루 가능횟수를 알려줍니다</div>
      </div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <a class="role-btn admin" href="03-admin-workbook.html" onclick="return goRole('admin', this)">
      <div class="ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      </div>
      <div class="tx">
        <div class="t">VM 관리자</div>
        <div class="s">제출된 내용을 확인하고 인터뷰를 배정합니다</div>
      </div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <a class="role-btn faq" href="05-faq.html" onclick="return goRole('faqTab', this)">
      <div class="ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg>
      </div>
      <div class="tx">
        <div class="t">자주 묻는 질문(FAQ)</div>
        <div class="s">궁금한 내용을 먼저 확인해보세요</div>
      </div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </a>
  </div>

  <div class="footer-note">이 화면은 브라우저에 저장되는 연동 데모입니다</div>
</div>

<script>
  // 앱 셸(app.html) iframe 안에서 열렸다면 부모의 탭 전환 함수를 직접 호출해
  // 하단 탭바 상태(선택 표시)까지 함께 맞춰줍니다. 독립적으로 열렸을 때는
  // 그냥 href를 따라 해당 화면으로 이동합니다.
  function goRole(role, el){
    try {
      if (window.parent && window.parent !== window && typeof window.parent.setTab === 'function') {
        if (role === 'applicant') window.parent.setTab('applicant');
        else if (role === 'interviewer') window.parent.setTab('interviewer');
        else if (role === 'admin') window.parent.setTab('admin');
        else if (role === 'faqTab') {
          window.parent.setTab('inquiry');
          if (typeof window.parent.setInquiry === 'function') window.parent.setInquiry('faq');
        }
        return false; // 부모 탭 전환으로 처리했으니 이 iframe 자체 이동은 막음
      }
    } catch (e) {}
    return true; // 독립 실행일 때는 href로 정상 이동
  }
</script>
</body>
</html>
