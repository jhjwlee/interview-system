<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>인터뷰 예약 앱 (데모) · 2027 SIC</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --ink:#0f1012; --canvas:#f2f2f4; --surface:#fdfdfd; --steel:#5e5e5e; --ash:#8f8f8f;
    --blue:#0071e3; --blue-wash:rgba(0,113,227,0.08); --hair:rgba(0,0,0,0.09);
    --font:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font); font-weight:350; letter-spacing:-0.02em; color:var(--ink);
    background:#e3e4e8; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh; padding:0;
  }

  .device{
    position:relative; width:100%; height:100dvh; max-width:430px; max-height:100dvh;
    background:var(--canvas); display:flex; flex-direction:column; overflow:hidden;
  }
  @media (min-width:640px){
    body{ padding:36px 16px; }
    .device{
      height:min(860px, calc(100vh - 72px)); border-radius:44px; border:10px solid #1c1c1e;
      box-shadow:0 30px 70px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.06);
    }
    .device::before{
      content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:120px; height:26px; background:#1c1c1e; border-radius:0 0 16px 16px; z-index:30;
    }
  }

  .appbar{
    flex-shrink:0; display:flex; align-items:center; gap:10px; padding:16px 18px 12px;
    background:rgba(253,253,253,0.92); backdrop-filter:saturate(180%) blur(14px);
    border-bottom:0.5px solid var(--hair); position:relative; z-index:20;
  }
  .appbar .mark{
    width:30px; height:30px; border-radius:9px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; flex-shrink:0;
  }
  .appbar .titles{min-width:0;}
  .appbar h1{font-size:14.5px; font-weight:500; line-height:1.3;}
  .appbar .sub{font-size:10.5px; color:var(--ash); margin-top:1px;}
  .appbar .tag{
    margin-left:auto; font-size:9.5px; font-weight:500; color:var(--blue); background:var(--blue-wash);
    padding:4px 9px; border-radius:9999px; flex-shrink:0; white-space:nowrap;
  }

  .segrow{ display:none; padding:10px 14px 0; gap:8px; background:var(--canvas); flex-shrink:0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .segrow.show{ display:flex; }
  .seg{
    flex:0 0 auto; text-align:center; font-size:11.5px; font-weight:400; color:var(--steel); white-space:nowrap;
    background:var(--surface); border:0.5px solid var(--hair); border-radius:9999px; padding:8px 14px; cursor:pointer;
  }
  .seg.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .content{ flex:1; min-height:0; background:var(--canvas); position:relative; }
  .content iframe{ width:100%; height:100%; border:none; display:block; background:var(--canvas); }
  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--ash); background:var(--canvas); pointer-events:none; opacity:0; transition:opacity .15s;
  }
  .loading.show{ opacity:1; }

  .tabbar{
    flex-shrink:0; display:flex; padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    background:rgba(253,253,253,0.94); backdrop-filter:saturate(180%) blur(14px);
    border-top:0.5px solid var(--hair); position:relative; z-index:20;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 1px;
    border:none; background:none; cursor:pointer; color:var(--ash); font-family:inherit;
  }
  .tab svg{ width:20px; height:20px; }
  .tab span{ font-size:9.5px; font-weight:400; letter-spacing:-0.02em; }

  .resetfab{
    position:absolute; right:10px; bottom:calc(64px + env(safe-area-inset-bottom)); z-index:25;
    width:34px; height:34px; border-radius:9999px; background:rgba(15,16,18,0.82); color:#fff;
    border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>

<div class="device">
  <div class="appbar">
    <div class="mark">SIC</div>
    <div class="titles">
      <h1 id="screenTitle">개요</h1>
      <div class="sub">2027 서울 국제대회 · 인터뷰 예약 앱</div>
    </div>
    <div class="tag">DEMO</div>
  </div>

  <div class="segrow" id="ivwSeg">
    <div class="seg on" data-sub="03-interviewer-availability" onclick="setSub('interviewer', this)">가능시간 등록</div>
    <div class="seg" data-sub="04-interviewer-approval" onclick="setSub('interviewer', this)">배정 확인</div>
    <div class="seg" data-sub="06-teams-approval" onclick="setSub('interviewer', this)">Teams 확인요청</div>
  </div>
  <div class="segrow" id="adminSeg">
    <div class="seg on" data-sub="02-admin-booking" onclick="setSub('admin', this)">예약시스템</div>
    <div class="seg" data-sub="09-weekly-dashboard" onclick="setSub('admin', this)">주간현황</div>
    <div class="seg" data-sub="05-admin-helpdesk" onclick="setSub('admin', this)">헬프데스크</div>
    <div class="seg" data-sub="07-teams-reassign" onclick="setSub('admin', this)">Teams 재배정</div>
  </div>

  <div class="content">
    <iframe id="frame" src="screens/00-workflow.html" title="app-content"></iframe>
    <div class="loading" id="loading">불러오는 중…</div>
  </div>

  <button class="resetfab" id="resetBtn" title="데모 데이터 초기화" onclick="resetDemo()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
  </button>

  <div class="tabbar" id="tabbar">
    <button class="tab" data-tab="overview" onclick="setTab('overview')" style="color:#8f8f8f;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>개요</span>
    </button>
    <button class="tab" data-tab="applicant" onclick="setTab('applicant')" style="color:#8f8f8f;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      <span>신청자</span>
    </button>
    <button class="tab" data-tab="interviewer" onclick="setTab('interviewer')" style="color:#8f8f8f;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>인터뷰어</span>
    </button>
    <button class="tab" data-tab="admin" onclick="setTab('admin')" style="color:#8f8f8f;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>관리자</span>
    </button>
    <button class="tab" data-tab="teams" onclick="setTab('teams')" style="color:#8f8f8f;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a15 15 0 000 18M3 12h18"/></svg>
      <span>Teams</span>
    </button>
  </div>
</div>

<script>
  var TAB_COLOR = { overview:'#8f8f8f', applicant:'#0071e3', interviewer:'#1c8c5e', admin:'#b25c00', teams:'#6264a7' };
  var TAB_SCREEN = {
    overview: '00-workflow',
    applicant: '01-applicant-form',
    interviewer: '03-interviewer-availability',
    admin: '02-admin-booking',
    teams: '08-teams-tab'
  };
  var TAB_TITLE = { overview:'개요', applicant:'신청자', interviewer:'인터뷰어', admin:'관리자', teams:'Teams 통합' };
  var curTab = 'overview';
  var curSub = { interviewer: '03-interviewer-availability', admin: '02-admin-booking' };

  function showLoading(){
    var l = document.getElementById('loading');
    l.classList.add('show');
    clearTimeout(showLoading._t);
    showLoading._t = setTimeout(function(){ l.classList.remove('show'); }, 500);
  }

  function loadFrame(src){
    var f = document.getElementById('frame');
    if (f.getAttribute('src') === src) return;
    showLoading();
    f.setAttribute('src', src);
  }

  function setTab(id){
    curTab = id;
    document.querySelectorAll('.tab').forEach(function(t){
      var on = t.dataset.tab === id;
      t.style.color = on ? TAB_COLOR[id] : '#8f8f8f';
    });
    document.getElementById('ivwSeg').classList.toggle('show', id === 'interviewer');
    document.getElementById('adminSeg').classList.toggle('show', id === 'admin');
    document.getElementById('screenTitle').textContent = TAB_TITLE[id];

    var src = TAB_SCREEN[id];
    if (id === 'interviewer') src = curSub.interviewer;
    if (id === 'admin') src = curSub.admin;
    loadFrame('screens/' + src + '.html');
  }

  function setSub(group, el){
    var sub = el.dataset.sub;
    curSub[group] = sub;
    el.parentElement.querySelectorAll('.seg').forEach(function(s){ s.classList.remove('on'); });
    el.classList.add('on');
    loadFrame('screens/' + sub + '.html');
  }

  function resetDemo(){
    if (!confirm('이 브라우저에 저장된 데모 데이터를 모두 초기화할까요?\n(신청·예약·가용시간·배정 결과가 모두 지워집니다)')) return;
    try { localStorage.removeItem('vm2027_interview_demo_v1'); } catch (e) {}
    var f = document.getElementById('frame');
    try { f.contentWindow.location.reload(); } catch (e) { location.reload(); }
  }

  setTab('overview');
</script>

</body>
</html>
